name = "kaggle-sdxl-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "BACKEND_KV"

# Set with `wrangler secret put`:
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
# REGISTRATION_SECRET
# Kaggle API (optional — enables the /wake button to remotely start the notebook):
# KAGGLE_USERNAME
# KAGGLE_KEY
# KAGGLE_KERNEL   e.g. "masoodkaviri/kaggle-backend"

# Optional comma-separated Telegram numeric user IDs:
# [vars]
# ALLOWED_TELEGRAM_USER_IDS = "123456789,987654321"
